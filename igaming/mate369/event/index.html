<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="icon" href="../../../LOGO.ico" type="image/x-icon" />
  <title>MATE369 | 生日禮金專屬活動</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      overflow-x: hidden;
      background-color: #03140d;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      display: none;
      width: 0 !important;
      height: 0 !important;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      position: relative;
      overflow-x: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      background-color: #042116;
    }

    .canvas-stage {
      position: relative;
      width: 100%;
      line-height: 0;
    }

    .main-bg-img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 3 秒微彈呼吸動態 */
    @keyframes hintPulseLoop {
      0% {
        transform: scale(1) translateY(0);
        filter: brightness(1);
      }
      8% {
        transform: scale(0.95) translateY(2px);
        filter: brightness(1.1);
      }
      16% {
        transform: scale(1.02) translateY(-1px);
        filter: brightness(1.04);
      }
      22%, 100% {
        transform: scale(1) translateY(0);
        filter: brightness(1);
      }
    }

    .pill-item {
      animation: hintPulseLoop 3s ease-in-out infinite;
      transition: transform 0.08s ease, filter 0.08s ease;
    }

    .pill-item:active {
      transform: scale(0.92) translateY(3px) !important;
      filter: brightness(0.85) !important;
    }

    /* 1. 頂部右上角雙膠囊標籤：嚴格置於深綠底橫帶右側 */
    .pills-top-slot {
      position: absolute;
      top: 8.6%;
      right: 4.2%;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .pills-top-slot .pill-item img {
      height: 27px;
      width: auto;
      display: block;
    }

    /* 2. 最底層滿版返回上一頁按鈕 (回 MATE369 作品集) */
    .bottom-back-slot {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      z-index: 30;
      line-height: 0;
    }

    .bottom-back-link {
      display: block;
      width: 100%;
      line-height: 0;
      text-decoration: none;
      transition: opacity 0.1s ease;
    }

    .bottom-back-link:active {
      opacity: 0.88;
    }

    .bottom-back-link img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 3. 右下角常駐火箭回頂鈕 */
    .back-to-top {
      position: fixed;
      right: calc(50% - 205px);
      bottom: 22px; /* 稍微避開底層滿版返回列 */
      width: 72px;
      height: auto;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transform: translateY(20px);
      transition: all 0.28s ease;
      z-index: 999;
      border: none;
      background: transparent;
      padding: 0;
      line-height: 0;
    }

    @media (max-width: 480px) {
      .back-to-top {
        right: 12px;
        width: 18px;
        width: 68px;
      }
    }

    .back-to-top.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .back-to-top:active {
      transform: scale(0.9);
    }

    .back-to-top img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5));
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="canvas-stage">

      <!-- 一頁式長圖背景 -->
      <img src="一頁式背景.webp" alt="MATE369 生日禮金專案" class="main-bg-img" />

      <!-- 頂部右上角標籤 -->
      <nav class="pills-top-slot">
        <a href="../../" class="pill-item" aria-label="其他娛樂城">
          <img src="一頁式其他娛樂城.webp" alt="其他娛樂城" />
        </a>
        <a href="../../../../" class="pill-item" aria-label="回總首頁">
          <img src="一頁式回首頁.webp" alt="回首頁" />
        </a>
      </nav>

      <!-- 最底層滿版返回鈕 (回 MATE369 作品集) -->
      <div class="bottom-back-slot">
        <a href="../" class="bottom-back-link" aria-label="回 MATE369 作品集">
          <img src="一頁式回上一頁.webp" alt="回 MATE369 作品集" />
        </a>
      </div>

    </div>
  </div>

  <!-- 常駐火箭回頂鈕 -->
  <button class="back-to-top" id="backToTopBtn" aria-label="回到頂端">
    <img src="一頁式火箭.webp" alt="回到頂端" />
  </button>

  <script>
    const backToTopBtn = document.getElementById('backToTopBtn');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 350) {
        backToTopBtn.classList.add('show');
      } else {
        backToTopBtn.classList.remove('show');
      }
    });

    backToTopBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    document.querySelectorAll('a, button').forEach(el => {
      el.addEventListener('touchstart', () => {
        if (navigator.vibrate) navigator.vibrate(12);
      });
    });
  </script>

</body>
</html>
