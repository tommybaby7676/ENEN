<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <link rel="icon" href="../../../LOGO.ico" type="image/x-icon" />
  <title>MATE369 | 站內互動模擬體驗</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #03140d;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      display: none;
      width: 0 !important;
      height: 0 !important;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .simulator-container {
      width: 100%;
      max-width: 440px;
      height: 100%;
      height: 100dvh;
      background-color: #052116;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }

    .header-stage {
      width: 100%;
      height: calc(100vw * 0.72);
      max-height: 317px;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      z-index: 10;
    }

    .header-bg-img {
      width: 100%;
      height: auto;
      display: block;
    }

    .game-tabs-row {
      width: 100%;
      height: 56px;
      background-color: #052116;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 4px;
      flex-shrink: 0;
      z-index: 15;
      border-bottom: 1px solid rgba(0, 232, 75, 0.15);
    }

    .tab-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      position: relative;
      transition: transform 0.08s ease;
    }

    .tab-btn:active {
      transform: scale(0.92);
    }

    .tab-btn img {
      height: 50px;
      width: auto;
      display: block;
    }

    /* 中央核心滾動展示區：高度自適應 */
    .content-viewport {
      flex: 1;
      width: 100%;
      position: relative;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .content-viewport::-webkit-scrollbar {
      display: none;
    }

    .panel-view {
      display: none;
      width: 100%;
      line-height: 0;
    }

    .panel-view.active {
      display: block;
    }

    .panel-img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 
      ======================================================
      核心改造：底部死死咬合容器 (Flex 垂直堆疊)
      ======================================================
    */
    .fixed-bottom-stack {
      width: 100%;
      position: relative;
      z-index: 50;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      background-color: #032115;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .bottom-nav-bar {
      position: relative;
      width: 100%;
      height: 54px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 8px;
    }

    .bottom-nav-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      z-index: 1;
      pointer-events: none;
    }

    .nav-item {
      position: relative;
      z-index: 2;
      background: transparent;
      border: none;
      cursor: pointer;
      line-height: 0;
      padding: 2px;
      transition: transform 0.08s ease, filter 0.08s ease;
    }

    .nav-item:active {
      transform: scale(0.92) translateY(2px) !important;
      filter: brightness(0.85);
    }

    .nav-item img {
      height: 38px;
      width: auto;
      display: block;
    }

    .nav-item-center {
      position: relative;
      z-index: 3;
      margin-top: -20px;
      padding: 0;
    }

    .nav-item-center img {
      height: 52px;
      width: auto;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5));
    }

    .global-exit-bar {
      width: 100%;
      line-height: 0;
      background-color: #032115;
    }

    .global-exit-link {
      display: block;
      width: 100%;
      text-decoration: none;
      line-height: 0;
    }

    .global-exit-link img {
      width: 100%;
      height: auto;
      display: block;
    }

    .global-exit-link:active {
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <div class="simulator-container">

    <header class="header-stage" id="mainHeader">
      <img src="模擬背景.webp" alt="MATE369 迎賓" class="header-bg-img" />
    </header>

    <nav class="game-tabs-row" id="gameTabsRow">
      <button class="tab-btn active" data-game="hot" aria-label="熱門">
        <img src="熱門icon.webp" alt="HOT" />
      </button>
      <button class="tab-btn" data-game="slot" aria-label="電子">
        <img src="電子icon.webp" alt="SLOT" />
      </button>
      <button class="tab-btn" data-game="sport" aria-label="體育">
        <img src="體育icon.webp" alt="SPORT" />
      </button>
      <button class="tab-btn" data-game="live" aria-label="真人">
        <img src="真人icon.webp" alt="LIVE" />
      </button>
      <button class="tab-btn" data-game="board" aria-label="棋牌">
        <img src="旗牌icon.webp" alt="BOARD" />
      </button>
      <button class="tab-btn" data-game="fish" aria-label="捕魚">
        <img src="捕魚icon.webp" alt="FISH" />
      </button>
    </nav>

    <main class="content-viewport" id="contentViewport">
      <div class="panel-view active" id="panel-game-hot">
        <img src="熱門.webp" alt="熱門遊戲" class="panel-img" />
      </div>
      <div class="panel-view" id="panel-game-slot">
        <img src="電子.webp" alt="電子遊戲" class="panel-img" />
      </div>
      <div class="panel-view" id="panel-game-sport">
        <img src="體育.webp" alt="體育賽事" class="panel-img" />
      </div>
      <div class="panel-view" id="panel-game-live">
        <img src="真人.webp" alt="真人百家樂" class="panel-img" />
      </div>
      <div class="panel-view" id="panel-game-board">
        <img src="旗牌.webp" alt="棋牌遊戲" class="panel-img" />
      </div>
      <div class="panel-view" id="panel-game-fish">
        <img src="捕魚.webp" alt="捕魚遊戲" class="panel-img" />
      </div>
      <div class="panel-view" id="panel-deposit">
        <img src="存款.webp" alt="存款中心" class="panel-img" />
      </div>
      <div class="panel-view" id="panel-promo">
        <img src="優惠.webp" alt="優惠活動" class="panel-img" />
      </div>
      <div class="panel-view" id="panel-my">
        <img src="我的.webp" alt="會員中心" class="panel-img" />
      </div>
    </main>

    <!-- 底部固定底座 (導航列 + 退回列死死綁定) -->
    <div class="fixed-bottom-stack">
      
      <footer class="bottom-nav-bar">
        <img src="icon底.webp" alt="底座" class="bottom-nav-bg" />
        <button class="nav-item" id="btnOurMate" aria-label="社群">
          <img src="社群icon.webp" alt="OUR MATE" />
        </button>
        <button class="nav-item" id="btnDeposit" aria-label="存款">
          <img src="存款icon.webp" alt="Deposit" />
        </button>
        <button class="nav-item nav-item-center" id="btnHomeLobby" aria-label="大廳">
          <img src="首頁icon.webp" alt="M 首頁" />
        </button>
        <button class="nav-item" id="btnPromo" aria-label="優惠">
          <img src="優惠icon.webp" alt="Promo" />
        </button>
        <button class="nav-item" id="btnMy" aria-label="會員中心">
          <img src="我的icon.webp" alt="My" />
        </button>
      </footer>

      <div class="global-exit-bar">
        <a href="../" class="global-exit-link" aria-label="回 MATE369 作品集">
          <img src="回上頁.webp" alt="回 MATE369 作品集" />
        </a>
      </div>

    </div>

  </div>

  <script>
    function triggerVibrate() {
      if (navigator.vibrate) navigator.vibrate(12);
    }

    const viewport = document.getElementById('contentViewport');
    const mainHeader = document.getElementById('mainHeader');
    const gameTabsRow = document.getElementById('gameTabsRow');
    const tabButtons = document.querySelectorAll('.tab-btn');
    const allPanels = document.querySelectorAll('.panel-view');

    function showPanel(panelId, isLobby = false) {
      triggerVibrate();
      allPanels.forEach(p => p.classList.remove('active'));
      const target = document.getElementById(panelId);
      if (target) target.classList.add('active');

      if (isLobby) {
        mainHeader.style.display = 'block';
        gameTabsRow.style.display = 'flex';
      } else {
        mainHeader.style.display = 'none';
        gameTabsRow.style.display = 'none';
      }

      viewport.scrollTo({ top: 0 });
    }

    tabButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        tabButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const gameKey = btn.getAttribute('data-game');
        showPanel(`panel-game-${gameKey}`, true);
      });
    });

    document.getElementById('btnHomeLobby').addEventListener('click', () => {
      tabButtons.forEach(b => b.classList.remove('active'));
      document.querySelector('[data-game="hot"]').classList.add('active');
      showPanel('panel-game-hot', true);
    });

    document.getElementById('btnDeposit').addEventListener('click', () => {
      showPanel('panel-deposit', false);
    });

    document.getElementById('btnPromo').addEventListener('click', () => {
      showPanel('panel-promo', false);
    });

    document.getElementById('btnMy').addEventListener('click', () => {
      showPanel('panel-my', false);
    });

    document.getElementById('btnOurMate').addEventListener('click', () => {
      triggerVibrate();
      alert('【OUR MATE】社群交流與在線支援');
    });

    document.querySelectorAll('button, a').forEach(el => {
      el.addEventListener('touchstart', triggerVibrate);
    });
  </script>

</body>
</html>
