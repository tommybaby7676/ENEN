<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <link rel="icon" href="../../../../LOGO.ico" type="image/x-icon" />
  <title>金探吉 | 站內互動模擬體驗</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #030814;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .simulator-container {
      width: 100%;
      max-width: 440px;
      height: 100%;
      height: 100dvh;
      background-color: #070e28;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
    }

    .content-viewport {
      flex: 1;
      width: 100%;
      position: relative;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .content-viewport::-webkit-scrollbar {
      display: none;
    }

    .panel-view {
      display: none;
      width: 100%;
      position: relative;
      line-height: 0;
    }

    .panel-view.active {
      display: block;
    }

    .panel-img {
      width: 100%;
      height: auto;
      display: block;
    }

    .home-banner-slot {
      position: absolute;
      top: 8.8%;
      left: 0;
      width: 100%;
      line-height: 0;
      cursor: pointer;
      z-index: 10;
    }

    .home-banner-slot img {
      width: 100%;
      height: auto;
      display: block;
    }

    .panel-close-btn {
      position: absolute;
      top: 85.8%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 52px;
      height: 52px;
      background: transparent;
      border: none;
      cursor: pointer;
      line-height: 0;
      z-index: 30;
      transition: transform 0.08s ease;
    }

    .panel-close-btn:active {
      transform: translate(-50%, -50%) scale(0.9);
    }

    .panel-close-btn img {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.6));
    }

    .chat-back-btn {
      position: absolute;
      top: 4.8%;
      left: -8px !important;
      width: 88px;
      height: auto;
      background: transparent;
      border: none;
      cursor: pointer;
      line-height: 0;
      z-index: 30;
      padding: 0;
      margin: 0;
      transition: transform 0.08s ease;
    }

    .chat-back-btn:active {
      transform: scale(0.94);
    }

    .chat-back-btn img {
      width: 100%;
      height: auto;
      display: block;
    }

    .panel-crop-wrapper {
      width: 100%;
      overflow: hidden;
      margin-bottom: -15.5%;
    }

    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 80;
      display: none;
      line-height: 0;
    }

    .modal-overlay.active {
      display: block;
    }

    .modal-bg-dim {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .modal-card {
      position: absolute;
      top: 48%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      width: 76%;
      max-width: 330px;
      line-height: 0;
      z-index: 85;
      opacity: 0;
      transition: all 0.22s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }

    .modal-overlay.active .modal-card {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .modal-card img {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.7));
    }

    .modal-confirm-btn {
      position: absolute;
      bottom: 8.5%;
      left: 35%;
      width: 30%;
      height: 8.5%;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 90;
    }

    /* 
      ======================================================
      核心改造：底部死死咬合容器 (Flex 垂直堆疊)
      ======================================================
    */
    .fixed-bottom-stack {
      width: 100%;
      position: relative;
      z-index: 50;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      background-color: #070e28;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .bottom-nav-bar {
      position: relative;
      width: 100%;
      z-index: 50;
      background: transparent !important;
      border: none !important;
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      padding: 0 4px 6px; /* 微幅底邊距，創造精準咬合感 */
    }

    .bottom-nav-bar.hidden {
      display: none !important;
    }

    .nav-item {
      position: relative;
      background: transparent;
      border: none;
      cursor: pointer;
      line-height: 0;
      padding: 0;
      transition: transform 0.08s ease;
    }

    .nav-item:active {
      transform: scale(0.9) translateY(2px) !important;
    }

    .nav-item img {
      height: 48px;
      width: auto;
      display: block;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.8));
    }

    .nav-item-gift {
      position: relative;
      margin-top: -14px;
      padding: 0;
    }

    .nav-item-gift img {
      height: 60px;
      width: auto;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.7));
    }

    .global-exit-bar {
      width: 100%;
      line-height: 0;
      background-color: #070e28;
    }

    .global-exit-link {
      display: block;
      width: 100%;
      line-height: 0;
      text-decoration: none;
    }

    .global-exit-link img {
      width: 100%;
      height: auto;
      display: block;
    }

    .global-exit-link:active {
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <div class="simulator-container">

    <main class="content-viewport" id="contentViewport">
      <div class="panel-view active" id="panel-home">
        <div class="home-banner-slot" id="btnHomeBanner" aria-label="查看活動公告">
          <img src="活動banner.webp" alt="新年禮包活動" />
        </div>
        <img src="首頁背景.webp" alt="金探吉娛樂城大廳" class="panel-img" />
      </div>

      <div class="panel-view" id="panel-rank">
        <div class="panel-crop-wrapper">
          <img src="排行榜背景.webp" alt="排行榜" class="panel-img" />
          <button class="panel-close-btn" data-close="true" aria-label="返回大廳">
            <img src="返回icon.webp" alt="關閉" />
          </button>
        </div>
      </div>

      <div class="panel-view" id="panel-shop">
        <div class="panel-crop-wrapper">
          <img src="商城背景.webp" alt="商城中心" class="panel-img" />
          <button class="panel-close-btn" data-close="true" aria-label="返回大廳">
            <img src="返回icon.webp" alt="關閉" />
          </button>
        </div>
      </div>

      <div class="panel-view" id="panel-gift">
        <div class="panel-crop-wrapper">
          <img src="贈禮背景.webp" alt="贈禮中心" class="panel-img" />
          <button class="panel-close-btn" data-close="true" aria-label="返回大廳">
            <img src="返回icon.webp" alt="關閉" />
          </button>
        </div>
      </div>

      <div class="panel-view" id="panel-chat">
        <button class="chat-back-btn" id="btnChatBack" aria-label="返回大廳">
          <img src="聊天返回cta.webp" alt="返回大廳" />
        </button>
        <img src="聊天背景.webp" alt="聊天室" class="panel-img" />
      </div>

      <div class="panel-view" id="panel-my">
        <div class="panel-crop-wrapper">
          <img src="我的背景.webp" alt="個人資訊" class="panel-img" />
          <button class="panel-close-btn" data-close="true" aria-label="返回大廳">
            <img src="返回icon.webp" alt="關閉" />
          </button>
        </div>
      </div>

      <div class="panel-view" id="panel-event">
        <div class="panel-crop-wrapper">
          <img src="活動背景.webp" alt="活動公告" class="panel-img" />
          <button class="panel-close-btn" data-close="true" aria-label="返回大廳">
            <img src="返回icon.webp" alt="關閉" />
          </button>
        </div>
      </div>
    </main>

    <div class="modal-overlay active" id="earlyBirdModal">
      <img src="模擬彈窗背景.webp" alt="遮罩背景" class="modal-bg-dim" />
      <div class="modal-card">
        <img src="模擬彈窗.webp" alt="早鳥獨享福利 2888點" />
        <button class="modal-confirm-btn" id="btnModalConfirm" aria-label="確認領取"></button>
      </div>
    </div>

    <!-- 底部固定底座 (導航列 + 退回列死死綁定) -->
    <div class="fixed-bottom-stack">

      <footer class="bottom-nav-bar" id="bottomNavBar">
        <button class="nav-item" id="btnRank" aria-label="排行榜">
          <img src="排行榜icon.webp" alt="排行榜" />
        </button>
        <button class="nav-item" id="btnShop" aria-label="商城">
          <img src="商城icon.webp" alt="商城" />
        </button>
        <button class="nav-item nav-item-gift" id="btnGift" aria-label="贈禮">
          <img src="贈禮icon.webp" alt="贈禮" />
        </button>
        <button class="nav-item" id="btnChat" aria-label="聊天">
          <img src="聊天icon.webp" alt="聊天" />
        </button>
        <button class="nav-item" id="btnMy" aria-label="我的">
          <img src="我的icon.webp" alt="我的" />
        </button>
      </footer>

      <div class="global-exit-bar">
        <a href="../" class="global-exit-link" aria-label="回金探吉作品集">
          <img src="頁尾回上頁.webp" alt="回金探吉作品集" />
        </a>
      </div>

    </div>

  </div>

  <script>
    function triggerVibrate() {
      if (navigator.vibrate) navigator.vibrate(12);
    }

    const viewport = document.getElementById('contentViewport');
    const allPanels = document.querySelectorAll('.panel-view');
    const navBar = document.getElementById('bottomNavBar');
    const modal = document.getElementById('earlyBirdModal');

    function switchPanel(panelId) {
      triggerVibrate();
      allPanels.forEach(p => p.classList.remove('active'));
      const target = document.getElementById(panelId);
      if (target) target.classList.add('active');

      if (panelId === 'panel-home') {
        navBar.classList.remove('hidden');
      } else {
        navBar.classList.add('hidden');
      }

      viewport.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('btnModalConfirm').addEventListener('click', (e) => {
      e.stopPropagation();
      triggerVibrate();
      modal.classList.remove('active');
    });

    modal.addEventListener('click', () => {
      triggerVibrate();
      modal.classList.remove('active');
    });

    document.getElementById('btnHomeBanner').addEventListener('click', () => {
      switchPanel('panel-event');
    });

    document.getElementById('btnRank').addEventListener('click', () => switchPanel('panel-rank'));
    document.getElementById('btnShop').addEventListener('click', () => switchPanel('panel-shop'));
    document.getElementById('btnGift').addEventListener('click', () => switchPanel('panel-gift'));
    document.getElementById('btnChat').addEventListener('click', () => switchPanel('panel-chat'));
    document.getElementById('btnMy').addEventListener('click', () => switchPanel('panel-my'));

    document.querySelectorAll('[data-close="true"]').forEach(btn => {
      btn.addEventListener('click', () => switchPanel('panel-home'));
    });

    document.getElementById('btnChatBack').addEventListener('click', () => switchPanel('panel-home'));

    document.querySelectorAll('button, a').forEach(el => {
      el.addEventListener('touchstart', triggerVibrate);
    });
  </script>

</body>
</html>
