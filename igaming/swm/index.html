<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="icon" href="../../LOGO.ico" type="image/x-icon" />
  <title>SWM | 娛樂城專案成果展示</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      overflow-x: hidden;
      background-color: #061e27;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      display: none;
      width: 0 !important;
      height: 0 !important;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      position: relative;
      overflow-x: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
      background-color: #082936;
    }

    .canvas-stage {
      position: relative;
      width: 100%;
      line-height: 0;
    }

    .main-bg-img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 3 秒同步呼吸循環動態 */
    @keyframes hintPulseLoop {
      0% {
        transform: scale(1) translateY(0);
        filter: brightness(1);
      }
      8% {
        transform: scale(0.95) translateY(2px);
        filter: brightness(1.1);
      }
      16% {
        transform: scale(1.02) translateY(-1px);
        filter: brightness(1.04);
      }
      22%, 100% {
        transform: scale(1) translateY(0);
        filter: brightness(1);
      }
    }

    /* 點擊手指專屬彈跳動態 */
    @keyframes fingerTapLoop {
      0% {
        transform: scale(1) translate(0, 0);
      }
      8% {
        transform: scale(1.12) translate(-3px, -3px);
      }
      16% {
        transform: scale(0.96) translate(1px, 1px);
      }
      22%, 100% {
        transform: scale(1) translate(0, 0);
      }
    }

    .pill-item,
    .bottom-pill-btn {
      animation: hintPulseLoop 3s ease-in-out infinite;
      transition: transform 0.08s ease, filter 0.08s ease;
    }

    .pill-item:active,
    .bottom-pill-btn:active {
      transform: scale(0.92) translateY(3px) !important;
      filter: brightness(0.85) !important;
    }

    /* 1. 頂部右上角雙膠囊標籤 */
    .pills-top-slot {
      position: absolute;
      top: 6%;
      right: 4.2%;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .pills-top-slot .pill-item img {
      height: 28px;
      width: auto;
      display: block;
    }

    /* 2. 上方核心 CTA：進入模擬器 (白貓手機樣機，視覺居中) */
    .simulator-entry-slot {
      position: absolute;
      top: 10.5%;
      left: 4.5%;
      width: 86%;
      z-index: 25;
      text-decoration: none;
      line-height: 0;
      animation: hintPulseLoop 3s ease-in-out infinite;
      transition: transform 0.1s ease;
    }

    .simulator-entry-slot:active {
      transform: scale(0.96) !important;
    }

    .simulator-entry-slot img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 3. 下方雙活動分支 CTA 區塊 */
    .event-entry-group {
      position: absolute;
      top: 92.2%;
      left: 45%;
      width: 48%;
      z-index: 25;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .event-btn-item {
      display: block;
      width: 100%;
      text-decoration: none;
      line-height: 0;
      position: relative;
      animation: hintPulseLoop 3s ease-in-out infinite;
      transition: transform 0.08s ease;
    }

    .event-btn-item:active {
      transform: scale(0.94) !important;
    }

    .event-btn-item img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 手指微彈提示掛在活動二的右下角 */
    .event-finger-img {
      position: absolute;
      right: -6px;
      bottom: -4px;
      width: 26px !important;
      max-width: 26px !important;
      height: auto !important;
      display: block;
      animation: fingerTapLoop 3s ease-in-out infinite;
      pointer-events: none;
      z-index: 10;
    }

    /* 4. 底部左下角雙膠囊標籤 */
    .bottom-pills-slot {
      position: absolute;
      top: 97.4%;
      left: 4.2%;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bottom-pill-btn img {
      height: 32px;
      width: auto;
      display: block;
    }

    /* 5. 常駐右下角火箭回頂鈕 (SWM 專屬黃色圓形火箭) */
    .back-to-top {
      position: fixed;
      right: calc(50% - 205px);
      bottom: 20px;
      width: 58px;
      height: auto;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transform: translateY(20px);
      transition: transform 0.25s ease, opacity 0.25s ease, bottom 0.2s ease;
      z-index: 999;
      border: none;
      background: transparent;
      padding: 0;
      line-height: 0;
    }

    @media (max-width: 480px) {
      .back-to-top {
        right: 14px;
        width: 54px;
      }
    }

    .back-to-top.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    /* 滑到底部時自動抬升，避免壓到底部元件 */
    .back-to-top.lifted {
      bottom: 48px;
    }

    .back-to-top:active {
      transform: scale(0.9);
    }

    .back-to-top img {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.6));
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="canvas-stage">

      <!-- 長圖背景 -->
      <img src="swm頁背景.webp" alt="SWM 娛樂城專案成果" class="main-bg-img" />

      <!-- 頂部右上角標籤 -->
      <nav class="pills-top-slot">
        <a href="../" class="pill-item" aria-label="其他娛樂城">
          <img src="swm其他娛樂城.webp" alt="其他娛樂城" />
        </a>
        <a href="../../../" class="pill-item" aria-label="回總首頁">
          <img src="swm回首頁.webp" alt="回首頁" />
        </a>
      </nav>

      <!-- 核心引導 1：進入站內模擬器體驗 -->
      <a href="./simulator/" class="simulator-entry-slot" aria-label="點擊進入 SWM 互動模擬體驗">
        <img src="進入模擬cta.webp" alt="進入模擬器" />
      </a>

      <!-- 核心引導 2：下方雙活動分支 CTA -->
      <div class="event-entry-group">
        <!-- 活動 1：迎戰世足 (掛載點擊手指) -->
        <a href="./event-worldcup/" class="event-btn-item" aria-label="進入迎戰世足活動頁">
          <img src="迎戰世足活動頁cta.webp" alt="迎戰世足活動頁" />
          <img src="一頁式活動手指.webp" alt="點擊指引" class="event-finger-img" />
        </a>
        <!-- 活動 2：電子報開獎 -->
        <a href="./event-lottery/" class="event-btn-item" aria-label="進入電子報開獎活動頁">
          <img src="電子報開獎活動cta.webp" alt="電子報開獎活動頁" />
        </a>
      </div>

      <!-- 底部左下角標籤 -->
      <div class="bottom-pills-slot">
        <a href="../../../" class="bottom-pill-btn" aria-label="回總首頁">
          <img src="swm回首頁.webp" alt="回首頁" />
        </a>
        <a href="../" class="bottom-pill-btn" aria-label="其他娛樂城">
          <img src="swm其他娛樂城.webp" alt="其他娛樂城" />
        </a>
      </div>

    </div>
  </div>

  <!-- 常駐火箭回頂鈕 -->
  <button class="back-to-top" id="backToTopBtn" aria-label="回到頂端">
    <img src="swm火箭.webp" alt="回到頂端" />
  </button>

  <script>
    const backToTopBtn = document.getElementById('backToTopBtn');

    window.addEventListener('scroll', () => {
      // 1. 滑動超過 350px 浮現
      if (window.scrollY > 350) {
        backToTopBtn.classList.add('show');
      } else {
        backToTopBtn.classList.remove('show');
      }

      // 2. 檢測觸底自動抬升
      const scrollBottom = document.documentElement.scrollHeight - (window.scrollY + window.innerHeight);
      if (scrollBottom < 70) {
        backToTopBtn.classList.add('lifted');
      } else {
        backToTopBtn.classList.remove('lifted');
      }
    });

    backToTopBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    document.querySelectorAll('a, button').forEach(el => {
      el.addEventListener('touchstart', () => {
        if (navigator.vibrate) navigator.vibrate(12);
      });
    });
  </script>

</body>
</html>
