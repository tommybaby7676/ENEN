<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <link rel="icon" href="../../../LOGO.ico" type="image/x-icon" />
  <title>SWM | 站內互動模擬體驗</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #03141a;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      display: none;
      width: 0 !important;
      height: 0 !important;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .simulator-container {
      width: 100%;
      max-width: 440px;
      height: 100%;
      height: 100dvh;
      background-color: #092632;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
    }

    /* 中央核心滾動舞台：高度自適應，不再需要猜測 padding-bottom */
    .content-viewport {
      flex: 1;
      width: 100%;
      position: relative;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .content-viewport::-webkit-scrollbar {
      display: none;
    }

    .panel-view {
      display: none;
      width: 100%;
      line-height: 0;
    }

    .panel-view.active {
      display: block;
    }

    .panel-img {
      width: 100%;
      height: auto;
      display: block;
    }

    .blur-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 35;
      display: none;
      line-height: 0;
    }

    .blur-overlay.active {
      display: block;
    }

    .blur-overlay img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 存提半圓扇形選單：以底座為定位基準 */
    .fan-menu-stage {
      position: absolute;
      bottom: calc(100% + 4px); /* 永遠懸浮在底座頂部上方 */
      left: 50%;
      transform: translateX(-50%) scale(0.8);
      width: 250px;
      height: 125px;
      z-index: 45;
      display: none;
      opacity: 0;
      transition: all 0.22s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      pointer-events: none;
    }

    .fan-menu-stage.active {
      display: block;
      opacity: 1;
      transform: translateX(-50%) scale(1);
      pointer-events: auto;
    }

    .fan-btn-left,
    .fan-btn-right {
      position: absolute;
      top: 0;
      width: 125px;
      height: 125px;
      background: transparent;
      border: none;
      cursor: pointer;
      line-height: 0;
      transition: transform 0.08s ease;
    }

    .fan-btn-left { left: 0; }
    .fan-btn-right { right: 0; }

    .fan-btn-left:active,
    .fan-btn-right:active {
      transform: scale(0.94);
    }

    .fan-btn-left img,
    .fan-btn-right img {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 
      ======================================================
      核心改造：底部死死咬合容器 (Flex 垂直堆疊)
      ======================================================
    */
    .fixed-bottom-stack {
      width: 100%;
      position: relative;
      z-index: 50;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      background-color: #0b1f28;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .bottom-nav-bar {
      position: relative;
      width: 100%;
      height: 52px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 4px;
    }

    .bottom-nav-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      z-index: 1;
      pointer-events: none;
    }

    .nav-item {
      position: relative;
      z-index: 2;
      background: transparent;
      border: none;
      cursor: pointer;
      line-height: 0;
      padding: 2px;
      transition: transform 0.08s ease;
    }

    .nav-item:active {
      transform: scale(0.9) translateY(2px) !important;
    }

    .nav-item img {
      height: 44px;
      width: auto;
      display: block;
      margin-top: 4px;
      filter: drop-shadow(0 2px 4px rgba(0, 240, 255, 0.3));
    }

    .nav-item-center {
      position: relative;
      z-index: 3;
      margin-top: -14px;
      padding: 0;
    }

    .nav-item-center img {
      height: 58px;
      margin-top: 0;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.6));
    }

    .global-exit-bar {
      width: 100%;
      line-height: 0;
      background-color: #0b1f28;
    }

    .global-exit-link {
      display: block;
      width: 100%;
      text-decoration: none;
      line-height: 0;
    }

    .global-exit-link img {
      width: 100%;
      height: auto;
      display: block;
    }

    .global-exit-link:active {
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <div class="simulator-container">

    <main class="content-viewport" id="contentViewport">
      <div class="panel-view active" id="panel-home">
        <img src="首頁背景.webp" alt="SWM 娛樂城大廳" class="panel-img" />
      </div>
      <div class="panel-view" id="panel-promo">
        <img src="優惠.webp" alt="優惠專區" class="panel-img" />
      </div>
      <div class="panel-view" id="panel-reward">
        <img src="領獎.webp" alt="領獎中心" class="panel-img" />
      </div>
      <div class="panel-view" id="panel-my">
        <img src="個人.webp" alt="個人中心" class="panel-img" />
      </div>
      <div class="panel-view" id="panel-deposit">
        <img src="存款.webp" alt="設定便利超商" class="panel-img" />
      </div>
      <div class="panel-view" id="panel-withdraw">
        <img src="取款.webp" alt="會員轉帳" class="panel-img" />
      </div>
    </main>

    <div class="blur-overlay" id="blurOverlay">
      <img src="存提背景.webp" alt="模糊背景" />
    </div>

    <!-- 底部固定底座 (導航列 + 退回列死死綁定) -->
    <div class="fixed-bottom-stack">
      
      <!-- 存提半圓扇形選單 -->
      <div class="fan-menu-stage" id="fanMenuStage">
        <button class="fan-btn-left" id="btnFanDeposit" aria-label="存款">
          <img src="存款icon.webp" alt="存款" />
        </button>
        <button class="fan-btn-right" id="btnFanWithdraw" aria-label="取款">
          <img src="取款icon.webp" alt="取款" />
        </button>
      </div>

      <!-- 導航列 -->
      <footer class="bottom-nav-bar">
        <img src="icon底.webp" alt="導航底座" class="bottom-nav-bg" />
        <button class="nav-item" id="btnHome" aria-label="首頁">
          <img src="首頁icon.webp" alt="首頁" />
        </button>
        <button class="nav-item" id="btnPromo" aria-label="優惠">
          <img src="優惠icon.webp" alt="優惠" />
        </button>
        <button class="nav-item nav-item-center" id="btnDepositWithdraw" aria-label="存提">
          <img src="存提icon.webp" alt="存提" />
        </button>
        <button class="nav-item" id="btnReward" aria-label="領獎">
          <img src="領獎icon.webp" alt="領獎" />
        </button>
        <button class="nav-item" id="btnMy" aria-label="個人">
          <img src="個人icon.webp" alt="個人" />
        </button>
      </footer>

      <!-- 退回作品集列 -->
      <div class="global-exit-bar">
        <a href="../" class="global-exit-link" aria-label="回 SWM 作品集">
          <img src="頁尾回上頁.webp" alt="回 SWM 作品集" />
        </a>
      </div>

    </div>

  </div>

  <script>
    function triggerVibrate() {
      if (navigator.vibrate) navigator.vibrate(12);
    }

    const viewport = document.getElementById('contentViewport');
    const allPanels = document.querySelectorAll('.panel-view');
    const blurOverlay = document.getElementById('blurOverlay');
    const fanMenuStage = document.getElementById('fanMenuStage');

    let isFanOpen = false;

    function closeFanMenu() {
      isFanOpen = false;
      fanMenuStage.classList.remove('active');
      blurOverlay.classList.remove('active');
    }

    function switchPanel(panelId) {
      triggerVibrate();
      closeFanMenu();
      allPanels.forEach(p => p.classList.remove('active'));
      const target = document.getElementById(panelId);
      if (target) target.classList.add('active');
      viewport.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('btnHome').addEventListener('click', () => switchPanel('panel-home'));
    document.getElementById('btnPromo').addEventListener('click', () => switchPanel('panel-promo'));
    document.getElementById('btnReward').addEventListener('click', () => switchPanel('panel-reward'));
    document.getElementById('btnMy').addEventListener('click', () => switchPanel('panel-my'));

    document.getElementById('btnDepositWithdraw').addEventListener('click', () => {
      triggerVibrate();
      isFanOpen = !isFanOpen;
      if (isFanOpen) {
        fanMenuStage.classList.add('active');
        blurOverlay.classList.add('active');
      } else {
        closeFanMenu();
      }
    });

    blurOverlay.addEventListener('click', () => {
      triggerVibrate();
      closeFanMenu();
    });

    document.getElementById('btnFanDeposit').addEventListener('click', () => switchPanel('panel-deposit'));
    document.getElementById('btnFanWithdraw').addEventListener('click', () => switchPanel('panel-withdraw'));

    document.querySelectorAll('button, a').forEach(el => {
      el.addEventListener('touchstart', triggerVibrate);
    });
  </script>

</body>
</html>
