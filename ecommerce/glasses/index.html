<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="icon" href="../../cat.ico" type="image/x-icon" />
  <title>鉅恒行銷 | 眼鏡行銷專案</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0b1a13;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* 手機視窗主容器 */
    .app-container {
      width: 100%;
      max-width: 440px;
      position: relative;
      overflow-x: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
      background-color: #02120b;
    }

    /* 背景舞台容器 */
    .canvas-stage {
      position: relative;
      width: 100%;
      line-height: 0;
    }

    .main-bg-img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 每 3 秒循環微彈呼吸動畫（前 0.6s 彈動，後 2.4s 靜止待機） */
    @keyframes hintPulseLoop {
      0% {
        transform: scale(1) translateY(0);
        filter: brightness(1);
      }
      8% {
        transform: scale(0.94) translateY(2px);
        filter: brightness(1.1);
      }
      16% {
        transform: scale(1.02) translateY(-1px);
        filter: brightness(1.04);
      }
      22%, 100% {
        transform: scale(1) translateY(0);
        filter: brightness(1);
      }
    }

    /* 將 3 秒呼吸動畫完整套用給所有按鈕 */
    .pill-item,
    .article-card-link,
    .bottom-pill-btn {
      animation: hintPulseLoop 3s ease-in-out infinite;
      transition: transform 0.08s ease, filter 0.08s ease;
    }

    /* 觸控/點擊瞬間：強烈擬物壓感反饋 */
    .pill-item:active,
    .article-card-link:active,
    .bottom-pill-btn:active {
      transform: scale(0.92) translateY(3px) !important;
      filter: brightness(0.85) !important;
    }

    /* 1. 頂部回首頁小房子 */
    .top-home-btn {
      position: absolute;
      top: 0.5%;
      left: 3.4%;
      width: 5.5%;
      z-index: 50;
      display: block;
      line-height: 0;
      transition: transform 0.08s ease;
    }

    .top-home-btn img {
      width: 100%;
      height: auto;
      display: block;
    }

    .top-home-btn:active {
      transform: scale(0.9) translateY(2px);
    }

    /* 2. 主視覺 BANNER */
    .banner-slot {
      position: absolute;
      top: 1.57%;
      left: 0;
      width: 100%;
      z-index: 20;
      line-height: 0;
    }

    .banner-slot img {
      width: 100%;
      height: auto;
      display: block;
    }

    .official-site-btn {
      position: absolute;
      left: 6%;
      top: 50%;
      width: 28%;
      height: 40%;
      border-radius: 50%;
      background: transparent;
      z-index: 25;
      text-decoration: none;
    }

    .official-site-btn:active {
      transform: scale(0.94);
    }

    /* 3. 頂部雙膠囊標籤 */
    .pills-top-slot {
      position: absolute;
      top: 8.79%;
      left: 0;
      width: 100%;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4%;
    }

    .pill-item {
      display: inline-block;
      text-decoration: none;
      line-height: 0;
    }

    .pill-item img {
      width: 100%;
      height: auto;
      display: block;
    }

    .pill-item.pill-left {
      width: 48%;
    }

    .pill-item.pill-right {
      width: 48%;
    }

    /* 4. 形象採訪 3 大卡片 */
    .article-card-1 {
      position: absolute;
      top: 51.46%;
      left: 5.72%;
      width: 88.5%;
      z-index: 30;
    }

    .article-card-2 {
      position: absolute;
      top: 63.15%;
      left: 5.72%;
      width: 88.5%;
      z-index: 30;
    }

    .article-card-3 {
      position: absolute;
      top: 72.58%;
      left: 5.72%;
      width: 88.5%;
      z-index: 30;
    }

    .article-card-link {
      display: block;
      width: 100%;
      line-height: 0;
      text-decoration: none;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
    }

    .article-card-link img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 5. 底部膠囊群（圖一標準比例：32px） */
    .bottom-pills-slot {
      position: absolute;
      top: 96.16%;
      left: 0;
      width: 100%;
      z-index: 30;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding: 0 4%;
    }

    .bottom-pill-btn {
      display: inline-block;
      text-decoration: none;
      line-height: 0;
    }

    .bottom-pill-btn img {
      height: 32px;
      width: auto;
      display: block;
    }

    /* 6. 底部黑底專案大按鈕 */
    .bottom-footer-slot {
      position: absolute;
      top: 97.40%;
      left: 0;
      width: 100%;
      z-index: 30;
      line-height: 0;
    }

    .bottom-footer-slot a {
      display: block;
      width: 100%;
      line-height: 0;
      text-decoration: none;
    }

    .bottom-footer-slot a:active {
      opacity: 0.9;
    }

    .bottom-footer-slot img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 7. 全域懸浮常駐火箭回頂鈕 */
    .back-to-top {
      position: fixed;
      right: calc(50% - 205px);
      bottom: 26px;
      width: 44px;
      height: 44px;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transform: translateY(20px);
      transition: all 0.28s ease;
      z-index: 999;
      border: none;
      background: transparent;
      padding: 0;
      line-height: 0;
    }

    @media (max-width: 480px) {
      .back-to-top {
        right: 16px;
      }
    }

    .back-to-top.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .back-to-top:active {
      transform: scale(0.9);
    }

    .back-to-top img {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.4));
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="canvas-stage">
      
      <img src="背景.webp" alt="眼鏡行銷成果展示" class="main-bg-img" />

      <!-- 1. 頂部回首頁小房子 -->
      <a href="../../" class="top-home-btn" aria-label="回到首頁">
        <img src="1-34.webp" alt="回首頁" />
      </a>

      <!-- 2. 主視覺 BANNER -->
      <div class="banner-slot">
        <img src="BANNER.webp" alt="鉅恒行銷形象主視覺" />
        <a href="https://webspuzzle.com.tw/category/cool" target="_blank" rel="noopener noreferrer" class="official-site-btn" aria-label="鉅恒官網"></a>
      </div>

      <!-- 3. 頂部雙膠囊標籤 -->
      <nav class="pills-top-slot">
        <a href="../" class="pill-item pill-left">
          <img src="其他電商品牌專案.webp" alt="其他電商品牌專案" />
        </a>
        <a href="../branding/" class="pill-item pill-right">
          <img src="1-31.webp" alt="品牌商標與視覺應用" />
        </a>
      </nav>

      <!-- 4. 形象拍攝 3 大卡片 -->
      <div class="article-card-1">
        <a href="https://webspuzzle.com.tw/2396" target="_blank" rel="noopener noreferrer" class="article-card-link">
          <img src="西服按鈕.webp" alt="品味風格 - 亞瑟時尚西服" />
        </a>
      </div>

      <div class="article-card-2">
        <a href="https://webspuzzle.com.tw/2549" target="_blank" rel="noopener noreferrer" class="article-card-link">
          <img src="刺青按鈕.webp" alt="紋樣青刻 - The Tattoo" />
        </a>
      </div>

      <div class="article-card-3">
        <a href="https://webspuzzle.com.tw/2079" target="_blank" rel="noopener noreferrer" class="article-card-link">
          <img src="眼鏡按鈕.webp" alt="獨一無二 - 瞳光眼鏡" />
        </a>
      </div>

      <!-- 5. 底部膠囊列 -->
      <div class="bottom-pills-slot">
        <a href="../../" class="bottom-pill-btn">
          <img src="回首頁.webp" alt="回首頁" />
        </a>
        <a href="../../branding/" class="bottom-pill-btn">
          <img src="1-31.webp" alt="品牌商標與視覺應用" />
        </a>
      </div>

      <!-- 6. 底部黑底大按鈕 -->
      <div class="bottom-footer-slot">
        <a href="../">
          <img src="頁尾.webp" alt="其他電商品牌專案" />
        </a>
      </div>

    </div>
  </div>

  <!-- 7. 全域懸浮火箭回頂鈕 -->
  <button class="back-to-top" id="backToTopBtn" aria-label="回到頂端">
    <img src="1-24.webp" alt="回到頂端" />
  </button>

  <script>
    const backToTopBtn = document.getElementById('backToTopBtn');

    window.addEventListener('scroll', () => {
      if (window.scrollY > 350) {
        backToTopBtn.classList.add('show');
      } else {
        backToTopBtn.classList.remove('show');
      }
    });

    backToTopBtn.addEventListener('click', () => {
      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
    });

    // 觸控微震動
    document.querySelectorAll('a, button').forEach(el => {
      el.addEventListener('touchstart', () => {
        if (navigator.vibrate) navigator.vibrate(12);
      });
    });
  </script>

</body>
</html>
