<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="icon" href="../../cat.ico" type="image/x-icon" />
  <title>鉅恒行銷 | 眼鏡行銷專案</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0b1a13;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 手機視窗主容器 */
    .app-container {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      background-color: #02120b;
      position: relative;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
    }

    /* 頂部導航列：背景已在長圖頂端，此處僅放左側回首頁小房子 */
    .top-header-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 48px;
      z-index: 50;
      display: flex;
      align-items: center;
      padding-left: 16px;
    }

    .home-top-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      width: 32px;
      height: 32px;
    }

    .home-top-btn img {
      width: 22px;
      height: 22px;
      display: block;
    }

    .home-top-btn:active {
      transform: scale(0.9);
      opacity: 0.8;
    }

    /* 主視覺 BANNER 區塊 */
    .hero-banner-wrap {
      position: relative;
      width: 100%;
      line-height: 0;
      margin-top: 48px; /* 留出頂部 Logo 空間 */
    }

    .hero-banner-img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 鉅恒官網熱區按鈕 (覆蓋在左下角發光圓圈處) */
    .official-site-btn {
      position: absolute;
      left: 5%;
      top: 48%;
      width: 30%;
      height: 42%;
      border-radius: 50%;
      cursor: pointer;
      text-decoration: none;
      background: transparent;
      z-index: 20;
    }

    .official-site-btn:active {
      transform: scale(0.95);
    }

    /* 頂部次選單快捷標籤列 */
    .sub-nav-tags {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding: 10px 14px 14px;
      background-color: #062217;
    }

    .tag-btn {
      display: inline-block;
      text-decoration: none;
      line-height: 0;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .tag-btn:active {
      transform: scale(0.95);
      opacity: 0.85;
    }

    .tag-btn img {
      height: 32px;
      width: auto;
      display: block;
    }

    /* 長圖展示本體 */
    .content-flow-wrap {
      width: 100%;
      position: relative;
      line-height: 0;
    }

    .content-flow-img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 形象拍攝 3 大按鈕浮動在長圖預留的空白中段 */
    .interactive-cards-wrap {
      width: 100%;
      padding: 0 14px;
      margin-top: -68%; /* 精準貼合在背景留白區 */
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
      z-index: 30;
    }

    .article-card {
      display: block;
      width: 100%;
      text-decoration: none;
      line-height: 0;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
      transition: transform 0.16s ease, filter 0.16s ease;
    }

    .article-card:hover {
      filter: brightness(1.03);
    }

    .article-card:active {
      transform: scale(0.985);
      filter: brightness(0.95);
    }

    .article-card img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 底部導航按鈕群 */
    .bottom-nav-group {
      width: 100%;
      background: #02120b;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 14px 24px;
      gap: 14px;
    }

    .bottom-pills-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    /* 整張頁尾切圖按鈕 */
    .footer-wide-btn {
      display: block;
      width: 100%;
      line-height: 0;
      text-decoration: none;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .footer-wide-btn:active {
      transform: scale(0.985);
      opacity: 0.9;
    }

    .footer-wide-btn img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 全域懸浮回到頂端按鈕 (火箭) */
    .back-to-top {
      position: fixed;
      right: calc(50% - 200px);
      bottom: 28px;
      width: 46px;
      height: 46px;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transform: translateY(20px);
      transition: all 0.28s ease;
      z-index: 999;
      border: none;
      background: transparent;
      padding: 0;
      line-height: 0;
    }

    @media (max-width: 480px) {
      .back-to-top {
        right: 16px;
      }
    }

    .back-to-top.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .back-to-top:active {
      transform: scale(0.9);
    }

    .back-to-top img {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.4));
    }
  </style>
</head>
<body>

  <!-- 手機視窗主容器 -->
  <div class="app-container">

    <!-- 1. 頂部左側回首頁小房子 -->
    <div class="top-header-bar">
      <a href="../../" class="home-top-btn" aria-label="回到首頁">
        <img src="1-34.webp" alt="回首頁" />
      </a>
    </div>

    <!-- 2. 主視覺 BANNER (內嵌官網外連按鈕) -->
    <section class="hero-banner-wrap">
      <img src="BANNER.webp" alt="鉅恒行銷形象主視覺" class="hero-banner-img" />
      <a href="https://webspuzzle.com.tw/category/cool" target="_blank" rel="noopener noreferrer" class="official-site-btn" aria-label="鉅恒官網"></a>
    </section>

    <!-- 3. 頂部次選單快捷標籤 -->
    <nav class="sub-nav-tags">
      <a href="../" class="tag-btn">
        <img src="其他電商品牌專案.webp" alt="其他電商品牌專案" />
      </a>
      <a href="../../branding/" class="tag-btn">
        <img src="1-31.webp" alt="品牌商標與視覺應用" />
      </a>
    </nav>

    <!-- 4. 長圖展示區塊 (靜態排版全貌) -->
    <section class="content-flow-wrap">
      <img src="背景.webp" alt="眼鏡行銷成果全圖" class="content-flow-img" />
    </section>

    <!-- 5. 採訪撰文 3 大獨立跳轉卡片 -->
    <section class="interactive-cards-wrap">
      <a href="https://webspuzzle.com.tw/2396" target="_blank" rel="noopener noreferrer" class="article-card">
        <img src="西服按鈕.webp" alt="品味風格 - 亞瑟時尚西服" />
      </a>

      <a href="https://webspuzzle.com.tw/2549" target="_blank" rel="noopener noreferrer" class="article-card">
        <img src="刺青按鈕.webp" alt="紋樣青刻 - The Tattoo" />
      </a>

      <a href="https://webspuzzle.com.tw/2079" target="_blank" rel="noopener noreferrer" class="article-card">
        <img src="眼鏡按鈕.webp" alt="獨一無二 - 瞳光眼鏡" />
      </a>
    </section>

    <!-- 6. 底部導航按鈕群 -->
    <footer class="bottom-nav-group">
      <div class="bottom-pills-row">
        <a href="../../" class="tag-btn">
          <img src="回首頁.webp" alt="回首頁" />
        </a>
        <a href="../../branding/" class="tag-btn">
          <img src="1-31.webp" alt="品牌商標與視覺應用" />
        </a>
      </div>
      <!-- 整張切好的頁尾按鈕圖 -->
      <a href="../" class="footer-wide-btn">
        <img src="頁尾.webp" alt="其他電商品牌專案" />
      </a>
    </footer>

  </div>

  <!-- 7. 全域懸浮回到頂端按鈕 -->
  <button class="back-to-top" id="backToTopBtn" aria-label="回到頂端">
    <img src="1-24.webp" alt="回到頂端" />
  </button>

  <script>
    const backToTopBtn = document.getElementById('backToTopBtn');

    window.addEventListener('scroll', () => {
      if (window.scrollY > 350) {
        backToTopBtn.classList.add('show');
      } else {
        backToTopBtn.classList.remove('show');
      }
    });

    backToTopBtn.addEventListener('click', () => {
      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
    });
  </script>

</body>
</html>
