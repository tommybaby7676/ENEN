<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="icon" href="../../cat.ico" type="image/x-icon" />
  <title>鉅恒行銷 | 眼鏡行銷專案</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0b1a13;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* 手機視窗主容器 */
    .app-container {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      background-color: #02120b;
      position: relative;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
    }

    /* 背景舞台容器 (以背景圖做基準，所有組件依百分比貼齊) */
    .canvas-stage {
      position: relative;
      width: 100%;
      line-height: 0;
    }

    .main-bg-img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 1. 頂部左上角回首頁小房子 */
    .top-home-btn {
      position: absolute;
      top: 0.9%;
      left: 3.5%;
      width: 7%;
      z-index: 50;
      display: block;
      line-height: 0;
      transition: transform 0.15s ease;
    }

    .top-home-btn img {
      width: 100%;
      height: auto;
      display: block;
    }

    .top-home-btn:active {
      transform: scale(0.9);
    }

    /* 2. 頂部主視覺 BANNER (精準填入上方綠底留白區) */
    .banner-slot {
      position: absolute;
      top: 2.3%;
      left: 0;
      width: 100%;
      z-index: 20;
      line-height: 0;
    }

    .banner-slot img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* BANNER 左下角的「鉅恒官網」熱區按鈕 */
    .official-site-btn {
      position: absolute;
      left: 6%;
      top: 50%;
      width: 28%;
      height: 40%;
      border-radius: 50%;
      background: transparent;
      z-index: 25;
      text-decoration: none;
    }

    .official-site-btn:active {
      transform: scale(0.94);
    }

    /* 3. BANNER 下方的兩個膠囊按鈕 */
    .pills-top-slot {
      position: absolute;
      top: 7.9%;
      left: 0;
      width: 100%;
      z-index: 20;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 3%;
      padding: 0 4%;
    }

    .pill-item {
      display: inline-block;
      text-decoration: none;
      line-height: 0;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .pill-item:active {
      transform: scale(0.94);
      opacity: 0.85;
    }

    .pill-item img {
      width: 100%;
      max-height: 32px;
      object-fit: contain;
      display: block;
    }

    .pill-item.pill-left {
      width: 46%;
    }

    .pill-item.pill-right {
      width: 46%;
    }

    /* 4. 中段 3 大採訪按鈕 (精準貼合「形象拍攝及採訪撰文」下方留白框) */
    .article-cards-slot {
      position: absolute;
      top: 61.8%;
      left: 0;
      width: 100%;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 1.1%;
      padding: 0 3.2%;
    }

    .article-btn {
      display: block;
      width: 100%;
      line-height: 0;
      text-decoration: none;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .article-btn:hover {
      filter: brightness(1.02);
    }

    .article-btn:active {
      transform: scale(0.985);
      filter: brightness(0.95);
    }

    .article-btn img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 5. 底部導航按鈕區 */
    .bottom-nav-group {
      width: 100%;
      background: #02120b;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 14px 28px;
      gap: 12px;
    }

    .bottom-pills-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .footer-wide-btn {
      display: block;
      width: 100%;
      line-height: 0;
      text-decoration: none;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .footer-wide-btn:active {
      transform: scale(0.985);
      opacity: 0.9;
    }

    .footer-wide-btn img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 6. 全域懸浮火箭回頂鈕 */
    .back-to-top {
      position: fixed;
      right: calc(50% - 205px);
      bottom: 26px;
      width: 44px;
      height: 44px;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transform: translateY(20px);
      transition: all 0.28s ease;
      z-index: 999;
      border: none;
      background: transparent;
      padding: 0;
      line-height: 0;
    }

    @media (max-width: 480px) {
      .back-to-top {
        right: 16px;
      }
    }

    .back-to-top.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .back-to-top:active {
      transform: scale(0.9);
    }

    .back-to-top img {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.4));
    }
  </style>
</head>
<body>

  <!-- 手機視窗主容器 -->
  <div class="app-container">

    <!-- 舞台核心：背景圖與精準定位按鈕群 -->
    <div class="canvas-stage">
      
      <!-- 底層全案長圖 -->
      <img src="背景.webp" alt="眼鏡行銷全案展示" class="main-bg-img" />

      <!-- 1. 頂部回首頁小房子 -->
      <a href="../../" class="top-home-btn" aria-label="回到首頁">
        <img src="1-34.webp" alt="回首頁" />
      </a>

      <!-- 2. 主視覺 BANNER (含官網外連按鈕) -->
      <div class="banner-slot">
        <img src="BANNER.webp" alt="鉅恒行銷形象主視覺" />
        <a href="https://webspuzzle.com.tw/category/cool" target="_blank" rel="noopener noreferrer" class="official-site-btn" aria-label="鉅恒官網"></a>
      </div>

      <!-- 3. BANNER 下方的兩個導航標籤 -->
      <nav class="pills-top-slot">
        <a href="../" class="pill-item pill-left">
          <img src="其他電商品牌專案.webp" alt="其他電商品牌專案" />
        </a>
        <a href="../../branding/" class="pill-item pill-right">
          <img src="1-31.webp" alt="品牌商標與視覺應用" />
        </a>
      </nav>

      <!-- 4. 中段 3 大採訪撰文按鈕 (精確填入綠色留白框) -->
      <section class="article-cards-slot">
        <!-- 亞瑟西服 -->
        <a href="https://webspuzzle.com.tw/2396" target="_blank" rel="noopener noreferrer" class="article-btn">
          <img src="西服按鈕.webp" alt="品味風格 - 亞瑟時尚西服" />
        </a>
        <!-- 刺青按鈕 -->
        <a href="https://webspuzzle.com.tw/2549" target="_blank" rel="noopener noreferrer" class="article-btn">
          <img src="刺青按鈕.webp" alt="紋樣青刻 - The Tattoo" />
        </a>
        <!-- 瞳光眼鏡按鈕 -->
        <a href="https://webspuzzle.com.tw/2079" target="_blank" rel="noopener noreferrer" class="article-btn">
          <img src="眼鏡按鈕.webp" alt="獨一無二 - 瞳光眼鏡" />
        </a>
      </section>

    </div>

    <!-- 5. 底部導航按鈕群 -->
    <footer class="bottom-nav-group">
      <div class="bottom-pills-row">
        <a href="../../" class="pill-item" style="width: auto;">
          <img src="回首頁.webp" alt="回首頁" style="height: 32px;" />
        </a>
        <a href="../../branding/" class="pill-item" style="width: auto;">
          <img src="1-31.webp" alt="品牌商標與視覺應用" style="height: 32px;" />
        </a>
      </div>
      <!-- 頁尾按鈕 -->
      <a href="../" class="footer-wide-btn">
        <img src="頁尾.webp" alt="其他電商品牌專案" />
      </a>
    </footer>

  </div>

  <!-- 6. 全域懸浮火箭回頂鈕 -->
  <button class="back-to-top" id="backToTopBtn" aria-label="回到頂端">
    <img src="1-24.webp" alt="回到頂端" />
  </button>

  <script>
    const backToTopBtn = document.getElementById('backToTopBtn');

    window.addEventListener('scroll', () => {
      if (window.scrollY > 350) {
        backToTopBtn.classList.add('show');
      } else {
        backToTopBtn.classList.remove('show');
      }
    });

    backToTopBtn.addEventListener('click', () => {
      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
    });
  </script>

</body>
</html>
