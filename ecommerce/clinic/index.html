<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="icon" href="../../cat.ico" type="image/x-icon" />
  <title>彤伊診所 | 醫美診所專案</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      overflow-x: hidden;
      background-color: #1a0f0d;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      position: relative;
      overflow-x: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
      background-color: #2b1c19;
    }

    .canvas-stage {
      position: relative;
      width: 100%;
      line-height: 0;
      overflow: hidden;
    }

    .main-bg-img {
      width: 100%;
      height: auto;
      display: block;
    }

    @keyframes hintPulse {
      0% { transform: scale(1); }
      50% { transform: scale(0.95) translateY(2px); filter: brightness(1.1); }
      100% { transform: scale(1) translateY(0); filter: brightness(1); }
    }

    /* 1. 頂部回首頁小房子 */
    .top-home-btn {
      position: absolute;
      top: 0.38%;
      left: 3.2%;
      width: 6.6%;
      z-index: 50;
      display: block;
      line-height: 0;
      transition: transform 0.08s ease;
    }

    .top-home-btn img {
      width: 100%;
      height: auto;
      display: block;
    }

    .top-home-btn:active {
      transform: scale(0.9) translateY(2px);
    }

    /* 2. 頂部雙膠囊標籤：恢復精緻等比，高度固定 28px，半壓 BANNER，絕不壓到「A1海報印刷」 */
    .pills-top-slot {
      position: absolute;
      top: 8.58%;
      left: 0;
      width: 100%;
      z-index: 20;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding: 0 3%;
    }

    .pills-top-slot .pill-item {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      line-height: 0;
      animation: hintPulse 0.5s ease-out 0.25s 1 normal both;
      transition: transform 0.08s ease, filter 0.08s ease;
    }

    .pills-top-slot .pill-item:active {
      transform: scale(0.93) translateY(2px) !important;
      filter: brightness(0.88) !important;
    }

    .pills-top-slot .pill-item img {
      height: 28px; /* 四顆尺寸全面統一等比，告別拉爆暴肥 */
      width: auto;
      display: block;
    }

    /* 3. 底部雙膠囊標籤：高度 29px，微向上提避開底頁條 */
    .bottom-pills-slot {
      position: absolute;
      top: 95.3%;
      left: 0;
      width: 100%;
      z-index: 30;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 0 4%;
    }

    .bottom-pill-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      line-height: 0;
      transition: transform 0.08s ease, filter 0.08s ease;
    }

    .bottom-pill-btn:active {
      transform: scale(0.93) translateY(2px) !important;
      filter: brightness(0.88) !important;
    }

    .bottom-pill-btn img {
      height: 29px;
      width: auto;
      display: block;
    }

    /* 4. 底部滿版其他電商品牌專案按鈕 */
    .bottom-footer-slot {
      position: absolute;
      top: 97.07%;
      left: 0;
      width: 100%;
      z-index: 30;
      line-height: 0;
    }

    .bottom-footer-slot a {
      display: block;
      width: 100%;
      line-height: 0;
      text-decoration: none;
    }

    .bottom-footer-slot a:active {
      opacity: 0.9;
    }

    .bottom-footer-slot img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 5. 全域懸浮火箭回頂鈕 */
    .back-to-top {
      position: fixed;
      right: calc(50% - 205px);
      bottom: 26px;
      width: 44px;
      height: 44px;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transform: translateY(20px);
      transition: all 0.28s ease;
      z-index: 999;
      border: none;
      background: transparent;
      padding: 0;
      line-height: 0;
    }

    @media (max-width: 480px) {
      .back-to-top {
        right: 16px;
      }
    }

    .back-to-top.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .back-to-top:active {
      transform: scale(0.9);
    }

    .back-to-top img {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.4));
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="canvas-stage">
      
      <img src="背景.webp" alt="彤伊診所 醫美專案成果展示" class="main-bg-img" />

      <!-- 1. 頂部回首頁小房子 -->
      <a href="../../" class="top-home-btn" aria-label="回到首頁">
        <img src="左上回首頁.webp" alt="回首頁" />
      </a>

      <!-- 2. 頂部雙膠囊標籤 -->
      <nav class="pills-top-slot">
        <a href="../" class="pill-item" aria-label="其他電商品牌專案">
          <img src="其他電商品牌專案.webp" alt="其他電商品牌專案" />
        </a>
        <a href="../branding/" class="pill-item" aria-label="品牌商標與視覺應用">
          <img src="品牌商標與視覺應用.webp" alt="品牌商標與視覺應用" />
        </a>
      </nav>

      <!-- 3. 底部雙膠囊標籤列 -->
      <div class="bottom-pills-slot">
        <a href="../../" class="bottom-pill-btn" aria-label="回首頁">
          <img src="回首頁.webp" alt="回首頁" />
        </a>
        <a href="../../branding/" class="bottom-pill-btn" aria-label="品牌商標與視覺應用">
          <img src="品牌商標與視覺應用.webp" alt="品牌商標與視覺應用" />
        </a>
      </div>

      <!-- 4. 底部滿版其他電商品牌專案按鈕 -->
      <div class="bottom-footer-slot">
        <a href="../" aria-label="其他電商品牌專案">
          <img src="頁尾.webp" alt="其他電商品牌專案" />
        </a>
      </div>

    </div>
  </div>

  <button class="back-to-top" id="backToTopBtn" aria-label="回到頂端">
    <img src="火箭.webp" alt="回到頂端" />
  </button>

  <script>
    const backToTopBtn = document.getElementById('backToTopBtn');

    window.addEventListener('scroll', () => {
      if (window.scrollY > 350) {
        backToTopBtn.classList.add('show');
      } else {
        backToTopBtn.classList.remove('show');
      }
    });

    backToTopBtn.addEventListener('click', () => {
      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
    });

    document.querySelectorAll('a, button').forEach(el => {
      el.addEventListener('touchstart', () => {
        if (navigator.vibrate) navigator.vibrate(12);
      });
    });
  </script>

</body>
</html>
