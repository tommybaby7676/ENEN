<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="icon" href="../LOGO.ico" type="image/x-icon" />
  <title>電商品牌視覺 | E-COMMERCE</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      background-color: #0b1a13;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      height: 100vh;
      background: #0b1a13 url('電商背景.webp') no-repeat center center / cover;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      padding-bottom: 12px;
    }

    .top-header {
      width: 100%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px 20px 8px;
    }

    .home-btn {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: transform 0.08s ease;
    }

    .home-btn:active {
      transform: translateY(-50%) scale(0.92);
    }

    .home-btn img {
      width: 100%;
      height: auto;
      display: block;
    }

    .category-title {
      height: 48px;
      width: auto;
      object-fit: contain;
      display: block;
    }

    .filter-tags {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 4px 16px 10px;
    }

    .tag-link {
      display: inline-block;
      text-decoration: none;
      line-height: 0;
      transition: transform 0.08s ease, filter 0.08s ease;
    }

    .tag-link:active {
      transform: scale(0.93) translateY(2px) !important;
      filter: brightness(0.88) !important;
    }

    .tag-link img {
      height: 34px;
      width: auto;
      display: block;
    }

    .project-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      gap: 8px;
      padding: 0 16px;
    }

    /* 每 3 秒波浪式循環跳動 */
    @keyframes projectPulseLoop {
      0% {
        transform: scale(1) translateY(0);
        filter: brightness(1);
      }
      8% {
        transform: scale(0.96) translateY(2px);
        filter: brightness(1.1);
      }
      16% {
        transform: scale(1.02) translateY(-1px);
        filter: brightness(1.04);
      }
      22%, 100% {
        transform: scale(1) translateY(0);
        filter: brightness(1);
      }
    }

    .project-card {
      display: block;
      width: 100%;
      text-decoration: none;
      line-height: 0;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
      animation: projectPulseLoop 3s ease-in-out infinite;
      transition: transform 0.08s ease, filter 0.08s ease;
    }

    /* 4 張卡片時間差 (Stagger) */
    .project-card:nth-child(1) { animation-delay: 0.05s; }
    .project-card:nth-child(2) { animation-delay: 0.20s; }
    .project-card:nth-child(3) { animation-delay: 0.35s; }
    .project-card:nth-child(4) { animation-delay: 0.50s; }

    /* 觸控實體反饋 */
    .project-card:active {
      transform: scale(0.93) translateY(3px) !important;
      filter: brightness(0.85) !important;
    }

    .project-card img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <header class="top-header">
      <a href="../" class="home-btn" aria-label="回到首頁">
        <img src="回首頁.webp" alt="回首頁" />
      </a>
      <img src="電商品牌.webp" alt="電商品牌 E-COMMERCE" class="category-title" />
    </header>

    <nav class="filter-tags">
      <a href="../illustration/" class="tag-link">
        <img src="商業插畫.webp" alt="商業插畫" />
      </a>
      <a href="../branding/" class="tag-link">
        <img src="品牌商標與視覺應用.webp" alt="品牌商標與視覺應用" />
      </a>
    </nav>

    <main class="project-list">
      <a href="./glasses/" class="project-card">
        <img src="眼鏡行銷.webp" alt="眼鏡行銷專案" />
      </a>
      <a href="./petskin/" class="project-card">
        <img src="寵物護膚.webp" alt="寵物護膚專案" />
      </a>
      <a href="./bakery/" class="project-card">
        <img src="西式糕點店.webp" alt="西式糕點店專案" />
      </a>
      <a href="./clinic/" class="project-card">
        <img src="醫美診所.webp" alt="醫美診所專案" />
      </a>
    </main>

  </div>

  <script>
    document.querySelectorAll('.project-card, .tag-link, .home-btn').forEach(el => {
      el.addEventListener('touchstart', () => {
        if (navigator.vibrate) navigator.vibrate(12);
      });
    });
  </script>

</body>
</html>
