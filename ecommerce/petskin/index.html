<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="icon" href="../../cat.ico" type="image/x-icon" />
  <title>歸毛家族 | 寵物護膚專案大廳</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      overflow-x: hidden;
      background-color: #0f1c18;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* 手機視窗主容器 */
    .app-container {
      width: 100%;
      max-width: 440px;
      position: relative;
      overflow-x: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
      background-color: #27453d;
    }

    /* 畫布舞台 */
    .canvas-stage {
      position: relative;
      width: 100%;
      line-height: 0;
      overflow: hidden;
    }

    .main-bg-img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 解法 1：進場輕微微動提示動畫 */
    @keyframes hintPulse {
      0% { transform: scale(1); }
      50% { transform: scale(0.95) translateY(2px); filter: brightness(1.1); }
      100% { transform: scale(1) translateY(0); filter: brightness(1); }
    }

    /* 1. 頂部回首頁小房子 */
    .top-home-btn {
      position: absolute;
      top: 0.58%;
      left: 3.4%;
      width: 6.5%;
      z-index: 50;
      display: block;
      line-height: 0;
      transition: transform 0.08s ease;
    }

    .top-home-btn img {
      width: 100%;
      height: auto;
      display: block;
    }

    .top-home-btn:active {
      transform: scale(0.9) translateY(2px);
    }

    /* 2. 主視覺 BANNER 進入官網熱區 */
    .banner-slot {
      position: absolute;
      top: 1.92%;
      left: 0;
      width: 100%;
      z-index: 20;
      line-height: 0;
    }

    .banner-slot img {
      width: 100%;
      height: auto;
      display: block;
    }

    .official-site-btn {
      position: absolute;
      right: 6%;
      top: 50%;
      width: 33%;
      height: 18%;
      border-radius: 30px;
      background: transparent;
      z-index: 25;
      text-decoration: none;
    }

    .official-site-btn:active {
      transform: scale(0.94);
    }

    /* 3. 頂部雙膠囊標籤：半壓 BANNER，比例放大恰到好處 (高度 28px) */
    .pills-top-slot {
      position: absolute;
      top: 9.75%;
      left: 0;
      width: 100%;
      z-index: 20;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding: 0 4%;
    }

    .pills-top-slot .pill-item {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      line-height: 0;
      animation: hintPulse 0.5s ease-out 0.25s 1 normal both;
      transition: transform 0.08s ease, filter 0.08s ease;
    }

    /* 解法 3：實體物理壓感 */
    .pills-top-slot .pill-item:active {
      transform: scale(0.93) translateY(2px) !important;
      filter: brightness(0.88) !important;
    }

    .pills-top-slot .pill-item img {
      height: 28px;
      width: auto;
      display: block;
    }

    /* 4. 上方 3 顆核心專案入口方卡 */
    .top-cards-row {
      position: absolute;
      top: 11.27%;
      left: 0;
      width: 100%;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2.5%;
    }

    .top-card-item {
      width: 32%;
      display: block;
      text-decoration: none;
      line-height: 0;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      animation: hintPulse 0.5s ease-out 0.4s 1 normal both;
      transition: transform 0.08s ease, filter 0.08s ease;
    }

    .top-card-item:hover {
      filter: brightness(1.02);
    }

    .top-card-item:active {
      transform: scale(0.94) translateY(2px) !important;
      filter: brightness(0.88) !important;
    }

    .top-card-item img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 5. 下方 3 顆圓形卡片：放大圓卡直徑 (24%)，飽滿不失真 */
    .bottom-cards-row {
      position: absolute;
      top: 90.85%;
      left: 0;
      width: 100%;
      z-index: 20;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 6%;
    }

    .bottom-circle-item {
      width: 24%;
      display: block;
      text-decoration: none;
      line-height: 0;
      transition: transform 0.08s ease, filter 0.08s ease;
    }

    .bottom-circle-item:active {
      transform: scale(0.92) translateY(2px) !important;
      filter: brightness(0.88) !important;
    }

    .bottom-circle-item img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 6. 底部雙膠囊標籤列：高度調至 29px，微向上提避開頁尾條 */
    .bottom-pills-slot {
      position: absolute;
      top: 95.3%;
      left: 0;
      width: 100%;
      z-index: 30;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 0 4%;
    }

    .bottom-pill-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      line-height: 0;
      transition: transform 0.08s ease, filter 0.08s ease;
    }

    .bottom-pill-btn:active {
      transform: scale(0.93) translateY(2px) !important;
      filter: brightness(0.88) !important;
    }

    .bottom-pill-btn img {
      height: 29px;
      width: auto;
      display: block;
    }

    /* 7. 底部滿版其他電商品牌專案按鈕 */
    .bottom-footer-slot {
      position: absolute;
      top: 96.80%;
      left: 0;
      width: 100%;
      z-index: 30;
      line-height: 0;
    }

    .bottom-footer-slot a {
      display: block;
      width: 100%;
      line-height: 0;
      text-decoration: none;
    }

    .bottom-footer-slot a:active {
      opacity: 0.9;
    }

    .bottom-footer-slot img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 8. 全域懸浮火箭回頂鈕 */
    .back-to-top {
      position: fixed;
      right: calc(50% - 205px);
      bottom: 26px;
      width: 44px;
      height: 44px;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transform: translateY(20px);
      transition: all 0.28s ease;
      z-index: 999;
      border: none;
      background: transparent;
      padding: 0;
      line-height: 0;
    }

    @media (max-width: 480px) {
      .back-to-top {
        right: 16px;
      }
    }

    .back-to-top.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .back-to-top:active {
      transform: scale(0.9);
    }

    .back-to-top img {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.4));
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="canvas-stage">
      
      <img src="背景一.webp" alt="歸毛家族 寵物護膚全案展示" class="main-bg-img" />

      <!-- 1. 頂部回首頁小房子 -->
      <a href="../../" class="top-home-btn" aria-label="回到首頁">
        <img src="左上角回首頁.webp" alt="回首頁" />
      </a>

      <!-- 2. 主視覺 BANNER -->
      <div class="banner-slot">
        <img src="BANNER.webp" alt="歸毛家族形象主視覺" />
        <a href="https://www.goodmofamily.com/" target="_blank" rel="noopener noreferrer" class="official-site-btn" aria-label="進入官網"></a>
      </div>

      <!-- 3. 頂部雙膠囊標籤 -->
      <nav class="pills-top-slot">
        <a href="../" class="pill-item" aria-label="其他電商品牌專案">
          <img src="其他電商品牌專案.webp" alt="其他電商品牌專案" />
        </a>
        <a href="../branding/" class="pill-item" aria-label="品牌商標與視覺應用">
          <img src="品牌商標與視覺應用.webp" alt="品牌商標與視覺應用" />
        </a>
      </nav>

      <!-- 4. 上方 3 顆核心入口方卡 -->
      <section class="top-cards-row">
        <a href="./packaging/" class="top-card-item">
          <img src="背景二按鈕.webp" alt="包裝/產品設計" />
        </a>
        <a href="./liver/" class="top-card-item">
          <img src="背景三按鈕.webp" alt="產品一頁式銷售頁 - 護肝寶" />
        </a>
        <a href="./respiratory/" class="top-card-item">
          <img src="背景四按鈕.webp" alt="產品一頁式銷售頁 - 氣管寶" />
        </a>
      </section>

      <!-- 5. 下方 3 顆圓形卡片 -->
      <section class="bottom-cards-row">
        <a href="./packaging/" class="bottom-circle-item">
          <img src="背景二頁尾按鈕.webp" alt="包裝設計" />
        </a>
        <a href="./liver/" class="bottom-circle-item">
          <img src="背景三頁尾按鈕.webp" alt="一頁式銷售頁 - 護肝寶" />
        </a>
        <a href="./respiratory/" class="bottom-circle-item">
          <img src="背景四頁尾按鈕.webp" alt="一頁式銷售頁 - 氣管寶" />
        </a>
      </section>

      <!-- 6. 底部雙膠囊標籤列 -->
      <div class="bottom-pills-slot">
        <a href="../../" class="bottom-pill-btn" aria-label="回首頁">
          <img src="回首頁.webp" alt="回首頁" />
        </a>
        <a href="../../branding/" class="bottom-pill-btn" aria-label="品牌商標與視覺應用">
          <img src="品牌商標與視覺應用.webp" alt="品牌商標與視覺應用" />
        </a>
      </div>

      <!-- 7. 底部滿版其他電商品牌專案按鈕 -->
      <div class="bottom-footer-slot">
        <a href="../" aria-label="其他電商品牌專案">
          <img src="頁尾.webp" alt="其他電商品牌專案" />
        </a>
      </div>

    </div>
  </div>

  <button class="back-to-top" id="backToTopBtn" aria-label="回到頂端">
    <img src="火箭.webp" alt="回到頂端" />
  </button>

  <script>
    const backToTopBtn = document.getElementById('backToTopBtn');

    window.addEventListener('scroll', () => {
      if (window.scrollY > 350) {
        backToTopBtn.classList.add('show');
      } else {
        backToTopBtn.classList.remove('show');
      }
    });

    backToTopBtn.addEventListener('click', () => {
      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
    });

    // 解法 3：觸控微震動
    document.querySelectorAll('a, button').forEach(el => {
      el.addEventListener('touchstart', () => {
        if (navigator.vibrate) navigator.vibrate(12);
      });
    });
  </script>

</body>
</html>
